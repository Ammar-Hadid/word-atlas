<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <title>Word Atlas — Every word, mapped.</title>
  <meta name="description"
    content="Word Atlas is a modern dictionary: definitions, pronunciation, origins and an interactive map of meaning around every word." />
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0E0D0B" media="(prefers-color-scheme: dark)" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Word Atlas — Every word, mapped." />
  <meta property="og:description"
    content="Definitions, pronunciation, origins and an interactive map of meaning around every word." />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Apply the saved theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('wa:theme') || 'system';
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.jsx"></script>
</body>

</html>
